{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2>Join Vibe</h2>
        <p class="subtitle">Create an account to connect</p>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary full-width mt-4">Sign Up</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
    </div>
</div>
{% endblock %}
