{% extends 'base.html' %}
{% block content %}
<div class="auth-container">
    <div class="glass-card auth-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to your account</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary full-width mt-4">Log In</button>
        </form>
        <p class="auth-footer">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    </div>
</div>
{% endblock %}
